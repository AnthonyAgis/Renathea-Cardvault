<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Turnamen TCG Academia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* Leaderboard Styles */
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        
        /* Admin Deck Builder Styles */
        .admin-section { border: 2px dashed #e74c3c; padding: 20px; border-radius: 8px; background-color: #fff9f9; }
        .deck-workspace { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; min-height: 150px; background: #ecf0f1; padding: 10px; border-radius: 5px; }
        .mock-card { background: #34495e; color: white; text-align: center; padding: 20px 0; border-radius: 5px; font-size: 12px; cursor: pointer; }
        
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2ecc71; }
        .btn-admin-toggle { background-color: #e74c3c; margin-bottom: 20px; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- Simulasi Toggle Admin -->
    <button class="btn-admin-toggle" onclick="toggleAdminPanel()">Simulasi: Nyalakan/Matikan Akses Admin</button>

    <!-- BAGIAN 1: LEADERBOARD -->
    <h2>Leaderboard TCG Academia</h2>
    <table>
        <thead>
            <tr>
                <th>Peringkat</th>
                <th>Nama Pemain</th>
                <th>Total Poin</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <!-- Data akan dimuat melalui JavaScript di bawah -->
        </tbody>
    </table>

    <!-- BAGIAN 2: DECK BUILDER KHUSUS ADMIN (Awalnya Disembunyikan) -->
    <div id="admin-deck-builder" class="admin-section" style="display: none;">
        <h2 style="color: #e74c3c;">Area Admin: Input Deck Juara</h2>
        <p>Susun kartu secara visual di bawah ini. Setelah selesai 60 kartu, klik tombol Publish.</p>
        
        <!-- Simulasi Area Penyusunan Deck -->
        <div class="deck-workspace">
            <div class="mock-card">Kartu 1</div>
            <div class="mock-card">Kartu 2</div>
            <div class="mock-card">Kartu 3</div>
            <!-- Anda bisa menambahkan integrasi pencarian kartu visual di sini nantinya -->
        </div>
        
        <button onclick="openModal()">Publish as Champion Deck</button>
    </div>
</div>

<!-- Modal Formulir Metadata Deck Juara -->
<div id="publishModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>Finalisasi Deck Juara</h3>
        <p>Masukkan detail pemain yang menggunakan deck ini.</p>
        
        <div class="form-group">
            <label for="playerName">Nama Pemain</label>
            <input type="text" id="playerName" placeholder="Contoh: Andi Saputra" required>
        </div>
        
        <div class="form-group">
            <label for="eventName">Nama Event</label>
            <input type="text" id="eventName" placeholder="Contoh: TCG Academia - Week 1" required>
        </div>
        
        <div class="form-group">
            <label for="position">Posisi / Gelar</label>
            <input type="text" id="position" placeholder="Contoh: Juara 1" required>
        </div>
        
        <button onclick="submitDeck()" style="width: 100%;">Simpan ke Database</button>
    </div>
</div>

<script>
    // --- LOKAL DATA MOCKUP ---
    // Data ini mensimulasikan data yang ditarik dari database Anda.
    // Perhatikan ada pemain dengan 0 poin yang tetap masuk ke dalam daftar.
    const leaderboardData = [
        { name: "Budi Santoso", points: 15, status: "Active" },
        { name: "Siti Aminah", points: 10, status: "Active" },
        { name: "Anton", points: 5, status: "Active" },
        { name: "Reza Rahadian", points: 0, status: "Terdaftar" }, // Pemain poin 0
        { name: "Dewi Lestari", points: 0, status: "Terdaftar" }   // Pemain poin 0
    ];

    // --- FUNGSI RENDER LEADERBOARD ---
    function renderLeaderboard() {
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = ""; 
        
        // Mengurutkan dari poin tertinggi ke terendah
        leaderboardData.sort((a, b) => b.points - a.points);

        leaderboardData.forEach((player, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${player.name}</strong></td>
                <td>${player.points}</td>
                <td>${player.status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- FUNGSI TOGGLE ADMIN ---
    // Logika ini menggantikan peran "Cek Sesi Login Admin" di backend.
    function toggleAdminPanel() {
        const adminPanel = document.getElementById("admin-deck-builder");
        if (adminPanel.style.display === "none") {
            adminPanel.style.display = "block";
        } else {
            adminPanel.style.display = "none";
        }
    }

    // --- FUNGSI MODAL ---
    const modal = document.getElementById("publishModal");

    function openModal() {
        modal.style.display = "block";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    // Menutup modal jika area di luar kotak form diklik
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }

    // --- FUNGSI SUBMIT DECK ---
    function submitDeck() {
        const name = document.getElementById("playerName").value;
        const event = document.getElementById("eventName").value;
        const position = document.getElementById("position").value;

        if(!name || !event || !position) {
            alert("Harap isi semua kolom metadata!");
            return;
        }

        // Di sinilah Anda nantinya mengirim data ke database melalui AJAX/Fetch API
        console.log("Menyimpan Deck ke Database...");
        console.log("Pemain:", name, "| Event:", event, "| Posisi:", position);
        
        alert(`Deck Juara berhasil disimpan untuk ${name} pada event ${event}!`);
        
        // Reset form & tutup modal
        document.getElementById("playerName").value = "";
        document.getElementById("eventName").value = "";
        document.getElementById("position").value = "";
        closeModal();
    }

    // Jalankan render saat halaman pertama kali dimuat
    window.onload = renderLeaderboard;
</script>

</body>
</html>
